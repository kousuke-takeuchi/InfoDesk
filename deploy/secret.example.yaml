# Documentation only. Do not fill in and do not commit real values.
# Create the real Secret by hand. read -s prompts without echoing, so the values
# stay out of the screen and the shell history (see docs/15-home-server.md, step 4):
#   read -rsp 'ANTHROPIC_API_KEY: ' ANTHROPIC_API_KEY && echo
#   read -rsp 'INFODESK_NAS_PASSWORD: ' INFODESK_NAS_PASSWORD && echo
#   kubectl -n infodesk create secret generic infodesk-env \
#     --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
#     --from-literal=INFODESK_NAS_PASSWORD="$INFODESK_NAS_PASSWORD"
#   unset ANTHROPIC_API_KEY INFODESK_NAS_PASSWORD
# To change a value, delete it first: kubectl -n infodesk delete secret infodesk-env
apiVersion: v1
kind: Secret
metadata:
  name: infodesk-env
  namespace: infodesk
type: Opaque
stringData:
  ANTHROPIC_API_KEY: ""
  INFODESK_NAS_PASSWORD: ""
