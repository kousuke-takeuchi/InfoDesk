apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: infodesk-tick
  namespace: infodesk
spec:
  schedules: ["*/5 * * * *"]
  timezone: Asia/Tokyo
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  workflowSpec:
    workflowTemplateRef:
      name: infodesk-tick
