[package]
name = "infodesk"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
infodesk-core = { version = "0.1.0", path = "../core" }
reqwest = "0.13.5"
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }

[lib]
name = "infodesk_cli"
path = "src/lib.rs"

[[bin]]
name = "infodesk"
path = "src/main.rs"

[dev-dependencies]
async-trait = "0.1.92"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt"] }
