[package]
name = "infodesk"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
infodesk-core = { version = "0.1.0", path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
