[package]
name = "infodesk-app"
version = "0.1.0"
description = "InfoDesk desktop app"
authors = []
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "infodesk_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
infodesk-core = { version = "0.1.0", path = "../../crates/core" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json", "form"] }
infodesk = { version = "0.1.0", path = "../../crates/cli" }
async-trait = "0.1.92"
sha2 = "0.10.9"
base64 = "0.22.1"
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[dev-dependencies]
wiremock = "0.6.5"
tempfile = "3.27.0"
