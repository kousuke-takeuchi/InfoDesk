[package]
name = "infodesk-app"
version = "0.1.0"
description = "InfoDesk desktop app"
authors = []
edition = "2024"
rust-version = "1.89"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "infodesk_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
infodesk-core = { version = "0.1.0", path = "../../crates/core" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json"] }
infodesk = { version = "0.1.0", path = "../../crates/cli" }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"

[dev-dependencies]
async-trait = "0.1.92"
wiremock = "0.6.5"
tempfile = "3.27.0"
